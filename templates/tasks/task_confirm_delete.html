{% extends "base.html" %}

{% block content %}
<h2>Delete task</h2>
<form method="post" class="card">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ task.title }}"?</p>
    <button type="submit">Yes, delete</button>
    <a href="{% url 'task_list' %}">Cancel</a>
</form>
{% endblock %}
